<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Requirement: viewport-fit=cover for safe area inset support on notched devices (iOS)
         Approach: Enables env(safe-area-inset-*) CSS values for notch/home indicator clearance
         Alternatives considered:
           - No viewport-fit: Rejected — content overlaps notch on iOS when status bar is translucent -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Requirement: Browser UI chrome matches the CV's ink motif; fonts are self-hosted
         Approach: theme-color carries a build-time placeholder (see themeColorInjector in
                   vite.config.ts) filled from src/index.css so CSS stays the single source
                   of truth; Spectral/Space Mono/Silkscreen load via @font-face in
                   src/index.css — no Google Fonts network dependency (offline-first PWA)
         Alternatives considered:
           - Google Fonts link tag: Rejected — external request breaks offline PWA and adds latency
           - Hardcode theme-color: Rejected — would drift from the CSS palette on future changes
         NOTE: this comment names the placeholder in PROSE, never as the literal token.
         The injector is a global string replace and does not know what a comment is,
         so writing the token here would substitute the colour into this sentence. -->
    <meta name="theme-color" content="%THEME_COLOR%" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JT · CV" />
    <!-- Requirement: Page description that doubles as a social-preview fallback and
         matches the share-card copy
         Approach: Use the design handoff's richer wording (Cape Town, nine years, the
         "play through" concept) so the meta description, the Open Graph copy
         below, and the baked card art tell one consistent story
         Alternatives considered:
           - Keep the terser prior description: Rejected — it had drifted from the
             approved share copy; a single authored copy set is easier to keep truthful -->
    <meta
      name="description"
      content="Jaco Theron — a living CV you can play through. Solutions / Software / Sales Engineer & Analyst, Cape Town. Nine years turning messy business problems into working software."
    />
    <title>Jaco Theron — Living CV</title>

    <!-- Requirement: Rich link previews ("unfurls") when the CV URL is shared on
         LinkedIn, Facebook, X, WhatsApp, Slack, Telegram, iMessage, Discord, etc.
         Approach: Static Open Graph + Twitter Card tags in index.html so they are in
         the server-served HTML. URLs are absolute and target the live Vercel
         deployment; the 1200×630 landscape card ships at /share/og-card.png (from
         public/share/). Domain source: the repo's GitHub "homepage" field.
         Alternatives considered:
           - Inject tags client-side (e.g. React Helmet): Rejected — social scrapers do
             not run JavaScript, so runtime-injected tags are never seen
           - Relative og:image path: Rejected — most scrapers ignore a relative image
             and require an absolute URL
           - Build-time domain placeholder (like the theme-color one above): Rejected — the domain is
             stable and the handoff specifies hardcoded values; the indirection only
             pays off on a domain move, which is a deliberate manual edit anyway
         Keep in sync: if CV facts or card art change, re-generate the PNGs from
         guidelines/share-*.card.html and update this copy; if the OG art is ever
         resized, update og:image:width/height to match or previews may crop. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jaco Theron — Living CV" />
    <meta
      property="og:title"
      content="Jaco Theron — Solutions / Software / Sales Engineer & Analyst"
    />
    <meta
      property="og:description"
      content="A living CV you can play through — walk the little pixel runner from section to section. Nine years across insurance, banking, startups and consulting."
    />
    <!-- Requirement: one canonical URL for a page reachable at several.
         Vercel serves this deployment at the project alias AND at a per-branch
         preview alias, all byte-identical — without a canonical each one is a
         separate, competing copy of the same CV.
         Approach: absolute self-referencing canonical, matching og:url.
         Alternative: 308 host redirects — a better fix, but it needs the domain
         settings, not the repo; the canonical works today and stays correct
         after a redirect is added. -->
    <!-- Requirement: let a search engine resolve WHO this CV is about instead of
         inferring it from prose. A CV is the highest-value structured-data case
         in the fleet — Person is exactly what the page is.
         Approach: ONE @graph with @id-joined nodes — the Person and the
         ProfilePage that is about them. Values are copied from
         src/data/cv-data.ts (personal.name / title / location / linkedin /
         github); only what the page actually renders is marked up.
         Alternatives:
           - Inject at runtime from cv-data.ts: Rejected — scrapers and most
             crawlers do not run JS, which is the same reason the OG tags above
             are static. Static duplication of five strings is the cheaper error.
           - Add WebSite/Organization nodes: Rejected — this is one person's CV,
             not a site with a publisher; claiming an organisation would be
             marking up something the page does not show. -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@graph":[{"@type":"Person","@id":"https://see-veo.vercel.app/#person","name":"Jaco Theron","jobTitle":"Solutions / Software / Sales Engineer & Analyst","description":"A builder-first engineer who moves fluidly between the technical and the commercial \u2014 scoping and selling solutions, then designing and shipping them.","url":"https://see-veo.vercel.app/","address":{"@type":"PostalAddress","addressLocality":"Cape Town","addressCountry":"ZA"},"sameAs":["https://www.linkedin.com/in/jacotheron87","https://github.com/devmade-ai"]},{"@type":"ProfilePage","@id":"https://see-veo.vercel.app/#profilepage","url":"https://see-veo.vercel.app/","name":"Jaco Theron \u2014 Living CV","mainEntity":{"@id":"https://see-veo.vercel.app/#person"}}]}
    </script>
    <link rel="canonical" href="https://see-veo.vercel.app/" />
    <meta property="og:url" content="https://see-veo.vercel.app/" />
    <meta property="og:image" content="https://see-veo.vercel.app/share/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Jaco Theron — Curriculum Vitae, with a little pixel runner walking the page toward an amber flag."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Jaco Theron — Solutions / Software / Sales Engineer & Analyst"
    />
    <meta
      name="twitter:description"
      content="A living CV you can play through. Cape Town, South Africa."
    />
    <meta name="twitter:image" content="https://see-veo.vercel.app/share/og-card.png" />
    <meta name="twitter:image:alt" content="Jaco Theron — Curriculum Vitae share card." />
    <!-- Google tag (gtag.js) -->
    <!-- Requirement: Google Analytics (gtag.js) for site usage tracking
         Approach: Standard async gtag.js snippet in <head>; page-view fires on load
                   (single-page app, no client-side routing) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-61SDQXZSFT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-61SDQXZSFT');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Requirement: Capture beforeinstallprompt before React mounts
         Approach: Inline script stores the event on window so the React hook can retrieve it
         Alternatives considered:
           - Move listener to main.tsx before createRoot: Rejected — module scripts are deferred,
             so the event may still fire before the module executes
           - Synchronous external script: Rejected — adds a network request; inline is instant -->
    <script>
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
